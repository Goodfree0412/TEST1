<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大鱼吃小鱼游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 10px;
            background: linear-gradient(180deg, #87CEEB 0%, #1E90FF 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .info {
            color: white;
            margin-top: 15px;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .controls {
            color: white;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐟 大鱼吃小鱼 🐟</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info">
            <span>得分：<strong id="score">0</strong></span> | 
            <span>大小：<strong id="size">10</strong></span> |
            <span>生命：<strong id="lives">3</strong></span>
        </div>
        <div class="controls">
            使用鼠标或触摸控制鱼的移动 | 吃掉比你小的鱼，避开比你大的鱼！
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const sizeElement = document.getElementById('size');
        const livesElement = document.getElementById('lives');

        // 游戏状态
        let score = 0;
        let lives = 3;
        let gameOver = false;

        // 玩家鱼
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 10,
            speed: 5,
            color: '#FF6B6B',
            direction: 1 // 1 = 右, -1 = 左
        };

        // 敌人数组
        let enemies = [];
        let food = [];

        // 鼠标位置
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        // 监听鼠标移动
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // 监听触摸移动
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });

        // 生成敌人鱼
        function spawnEnemy() {
            if (gameOver) return;
            
            const size = Math.random() * 30 + 5;
            const fromLeft = Math.random() > 0.5;
            
            enemies.push({
                x: fromLeft ? -50 : canvas.width + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                size: size,
                speed: (Math.random() * 2 + 1) * (fromLeft ? 1 : -1),
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                direction: fromLeft ? 1 : -1
            });

            // 随时间增加生成频率
            setTimeout(spawnEnemy, Math.max(500, 2000 - score * 50));
        }

        // 生成食物
        function spawnFood() {
            if (gameOver) return;
            
            food.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                size: 5,
                color: '#FFD93D'
            });

            setTimeout(spawnFood, 1000);
        }

        // 绘制鱼
        function drawFish(fish, isPlayer = false) {
            ctx.save();
            ctx.translate(fish.x, fish.y);
            
            if (!isPlayer) {
                ctx.scale(fish.direction, 1);
            } else {
                ctx.scale(player.direction, 1);
            }
            
            // 鱼身
            ctx.beginPath();
            ctx.ellipse(0, 0, fish.size * 1.5, fish.size, 0, 0, Math.PI * 2);
            ctx.fillStyle = fish.color;
            ctx.fill();
            
            // 鱼尾
            ctx.beginPath();
            ctx.moveTo(-fish.size * 1.2, 0);
            ctx.lineTo(-fish.size * 2, -fish.size * 0.8);
            ctx.lineTo(-fish.size * 2, fish.size * 0.8);
            ctx.closePath();
            ctx.fillStyle = fish.color;
            ctx.fill();
            
            // 鱼鳍
            ctx.beginPath();
            ctx.moveTo(0, -fish.size * 0.8);
            ctx.lineTo(-fish.size * 0.5, -fish.size * 1.5);
            ctx.lineTo(fish.size * 0.5, -fish.size * 0.8);
            ctx.closePath();
            ctx.fillStyle = fish.color;
            ctx.fill();
            
            // 眼睛
            ctx.beginPath();
            ctx.arc(fish.size * 0.8, -fish.size * 0.3, fish.size * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(fish.size * 0.9, -fish.size * 0.3, fish.size * 0.1, 0, Math.PI * 2);
            ctx.fillStyle = 'black';
            ctx.fill();
            
            ctx.restore();
        }

        // 绘制食物
        function drawFood(f) {
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fillStyle = f.color;
            ctx.fill();
            
            // 发光效果
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 217, 61, 0.3)';
            ctx.fill();
        }

        // 更新玩家位置
        function updatePlayer() {
            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > 5) {
                player.x += (dx / distance) * player.speed;
                player.y += (dy / distance) * player.speed;
            }
            
            // 边界检查
            player.x = Math.max(player.size * 2, Math.min(canvas.width - player.size * 2, player.x));
            player.y = Math.max(player.size * 2, Math.min(canvas.height - player.size * 2, player.y));
            
            // 更新方向
            if (dx > 10) player.direction = 1;
            else if (dx < -10) player.direction = -1;
        }

        // 更新敌人位置
        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.x += enemy.speed;
                
                // 移除超出屏幕的敌人
                if (enemy.x < -100 || enemy.x > canvas.width + 100) {
                    enemies.splice(i, 1);
                    continue;
                }
                
                // 碰撞检测
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < player.size + enemy.size) {
                    if (player.size > enemy.size) {
                        // 吃掉敌人
                        score += Math.floor(enemy.size);
                        player.size = Math.min(50, player.size + 0.5);
                        enemies.splice(i, 1);
                    } else if (player.size < enemy.size) {
                        // 被敌人吃掉
                        lives--;
                        player.size = Math.max(10, player.size - 2);
                        enemies.splice(i, 1);
                        
                        if (lives <= 0) {
                            gameOver = true;
                        }
                    }
                }
            }
        }

        // 更新食物
        function updateFood() {
            for (let i = food.length - 1; i >= 0; i--) {
                const f = food[i];
                const dx = player.x - f.x;
                const dy = player.y - f.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < player.size + f.size) {
                    score += 10;
                    player.size = Math.min(50, player.size + 0.3);
                    food.splice(i, 1);
                }
            }
        }

        // 绘制背景气泡
        let bubbles = [];
        function updateBubbles() {
            if (Math.random() < 0.1) {
                bubbles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height,
                    size: Math.random() * 5 + 2,
                    speed: Math.random() * 2 + 1
                });
            }
            
            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].y -= bubbles[i].speed;
                if (bubbles[i].y < -10) {
                    bubbles.splice(i, 1);
                }
            }
        }

        function drawBubbles() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            bubbles.forEach(bubble => {
                ctx.beginPath();
                ctx.arc(bubble.x, bubble.y, bubble.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 游戏主循环
        function gameLoop() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!gameOver) {
                updatePlayer();
                updateEnemies();
                updateFood();
                updateBubbles();
                
                // 更新UI
                scoreElement.textContent = score;
                sizeElement.textContent = Math.floor(player.size);
                livesElement.textContent = lives;
            }
            
            // 绘制元素
            drawBubbles();
            food.forEach(drawFood);
            enemies.forEach(enemy => drawFish(enemy, false));
            drawFish(player, true);
            
            // 游戏结束画面
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '24px Arial';
                ctx.fillText(`最终得分：${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText(`点击重新开始`, canvas.width / 2, canvas.height / 2 + 60);
                
                // 点击重新开始
                canvas.addEventListener('click', restartGame, { once: true });
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // 重新开始游戏
        function restartGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.size = 10;
            enemies = [];
            food = [];
            bubbles = [];
            spawnEnemy();
            spawnFood();
            gameLoop();
        }

        // 启动游戏
        spawnEnemy();
        spawnFood();
        gameLoop();
    </script>
</body>
</html>
